<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"><title>Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; }
    #messages { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: .5rem; }
    #online, #typing { color: #666; font-size: .9rem; min-height: 1.2rem; }
  </style>
  <h2>Real-Time Chat Demo</h2>
<p>A portfolio project built with ASP.NET Core and SignalR. Pick any nickname and a room name to try it.
   Please don't enter passwords or personal information.</p>
</head>
<body>
  <h2>Chat</h2>
  <div>
    <input id="user" placeholder="Your name">
    <input id="room" placeholder="Room" value="general">
    <button id="join">Join</button>
  </div>
  <div id="online"></div>
  <div id="messages"></div>
  <div id="typing"></div>
  <input id="text" placeholder="Type a message" disabled>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let room, user, typingTimer, lastTyping = 0;

    const conn = new signalR.HubConnectionBuilder()
      .withUrl("/chat").withAutomaticReconnect().build();

    function addMessage(m) {
      const div = document.createElement("div");
      div.textContent = `[${new Date(m.sentAt).toLocaleTimeString()}] ${m.user}: ${m.text}`;
      $("messages").appendChild(div);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    conn.on("ReceiveMessage", addMessage);
    conn.on("PresenceChanged", users => $("online").textContent = "Online: " + users.join(", "));
    conn.on("UserTyping", name => {
      $("typing").textContent = `${name} is typing...`;
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => $("typing").textContent = "", 1500);
    });
    conn.onreconnected(() => conn.invoke("JoinRoom", room, user));

    $("join").onclick = async () => {
      user = $("user").value.trim(); room = $("room").value.trim();
      if (!user || !room) return;
      if (conn.state === signalR.HubConnectionState.Disconnected) await conn.start();
      $("messages").innerHTML = "";
      const history = await (await fetch(`/api/rooms/${room}/messages`)).json();
      history.forEach(addMessage);
      await conn.invoke("JoinRoom", room, user);
      $("text").disabled = false;
    };

    $("text").addEventListener("keydown", async e => {
      if (e.key === "Enter" && $("text").value.trim()) {
        await conn.invoke("SendMessage", room, user, $("text").value);
        $("text").value = "";
      } else if (Date.now() - lastTyping > 1000) {
        lastTyping = Date.now();
        conn.invoke("Typing", room, user);
      }
    });
  </script>
</body>
<footer style="margin-top:2rem;color:#666;font-size:.9rem">
  Portfolio project by Raghava ·
  <a href="https://github.com/raghava503/ChatApp">Source on GitHub</a>
</footer>
</html>
